name: Commercial workflow skills
on:
  push:
    paths: ['skills/**', 'tests/commercial-skills.test.py', '.github/workflows/commercial-skills.yml']
  pull_request:
    paths: ['skills/**', 'tests/commercial-skills.test.py', '.github/workflows/commercial-skills.yml']
permissions:
  contents: read
jobs:
  deterministic-helpers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tests/commercial-skills.test.py
