name: Verify Office Workflow Agent
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  product:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm exec tsc -p tsconfig.cloud.json
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test
      - run: pnpm test:e2e
      - run: pnpm audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: docs/evidence/
  publishing-contract:
    uses: Tiancheng-Xu/.github/.github/workflows/verify-project.yml@main
    with:
      install-command: pnpm install --frozen-lockfile
      test-command: pnpm exec tsx --test tests/planner.test.ts tests/cloud-repository.test.ts
      typecheck-command: pnpm typecheck
      build-command: pnpm build
      publish-config-path: .github/baby2b-publish.yml
